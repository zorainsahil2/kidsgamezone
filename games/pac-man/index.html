<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pac-Man Clone</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="game-container">
        <div class="game-header">
            <a href="../../index.html" class="back-link">🏠 Exit</a>
            <div class="game-title">Pac-Man</div>
            <div class="score-board">
                Score: <span id="scoreVal">0</span> | High: <span id="highScoreVal">0</span>
            </div>
        </div>

        <!-- Render Target -->
        <canvas id="gameCanvas" width="380" height="380"></canvas>

        <div class="game-footer">
            <span class="controls-hint">Arrows/WASD or Swipe to steer Pac-Man through the maze!</span>
            <button id="restartBtn" class="restart-btn">🔄 Restart</button>
        </div>
    </div>

    <!-- Script Logic -->
    <script src="game.js"></script>
</body>
</html>
