<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Dynamic Settings & Maintenance Guard -->
    <script>
        (function() {
            fetch('api/get-public-settings.php')
                .then(res => res.json())
                .then(settings => {
                    if (settings.maintenance_mode === '1') {
                        window.location.href = 'maintenance.html';
                        return;
                    }
                    
                    if (settings.site_name) {
                        document.title = document.title.replace('KidsGameZone', settings.site_name);
                        document.querySelectorAll('.portal-header__logo').forEach(el => {
                            el.innerText = '🎮 ' + settings.site_name;
                        });
                        const copyrightEl = document.querySelector('.portal-footer__copyright');
                        if (copyrightEl) {
                            copyrightEl.innerText = copyrightEl.innerText.replace('KidsGameZone', settings.site_name);
                        }
                    }
                    
                    if (settings.google_analytics_id && settings.google_analytics_id.trim() !== '') {
                        const gaId = settings.google_analytics_id;
                        const gaScript1 = document.createElement('script');
                        gaScript1.async = true;
                        gaScript1.src = 'https://www.googletagmanager.com/gtag/js?id=' + gaId;
                        document.head.appendChild(gaScript1);
                        
                        const gaScript2 = document.createElement('script');
                        gaScript2.innerHTML = `
                            window.dataLayer = window.dataLayer || [];
                            function gtag(){dataLayer.push(arguments);}
                            gtag('js', new Date());
                            gtag('config', '${gaId}');
                        `;
                        document.head.appendChild(gaScript2);
                    }

                    if (settings.global_custom_scripts && settings.global_custom_scripts.trim() !== '') {
                        const scriptDiv = document.createElement('div');
                        scriptDiv.style.display = 'none';
                        scriptDiv.innerHTML = settings.global_custom_scripts;
                        document.body.appendChild(scriptDiv);
                        
                        const scripts = scriptDiv.querySelectorAll('script');
                        scripts.forEach(oldScript => {
                            const newScript = document.createElement('script');
                            Array.from(oldScript.attributes).forEach(attr => {
                                newScript.setAttribute(attr.name, attr.value);
                            });
                            newScript.textContent = oldScript.textContent;
                            document.body.appendChild(newScript);
                        });
                    }
                })
                .catch(err => console.error('Error loading public configuration:', err));
        })();
    </script>
    <title>KidsGameZone Game Player</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
    
    <!-- Stylesheets -->
    <link rel="stylesheet" href="assets/css/game-page.css">
    
    <!-- Scripts (Loaded sync/async appropriately) -->
    <script src="assets/js/ads.js" defer></script>
    <script src="assets/js/game-loader.js" defer></script>
</head>
<body>

    <!-- Header / Brand Navigation -->
    <header class="portal-header">
        <a href="index.html" class="portal-header__logo">🎮 KidsGameZone</a>
        <a href="index.html" class="portal-header__back-btn">◀ Back to Home</a>
    </header>

    <!-- Top Leaderboard Ad Slot -->
    <div id="header_banner" class="ad-slot ad-slot--header">
        <!-- Injected by AdsManager -->
    </div>

    <!-- Breadcrumb Indicator -->
    <div class="breadcrumb-container">
        <ul class="breadcrumb">
            <li><a href="index.html" class="breadcrumb__link">Home</a></li>
            <li class="breadcrumb__separator">></li>
            <li><a href="#" id="breadcrumbCategoryLink" class="breadcrumb__link">Category</a></li>
            <li class="breadcrumb__separator">></li>
            <li id="breadcrumbGameTitle" class="breadcrumb__current">Game Title</li>
        </ul>
    </div>

    <!-- Main Player Workspace Layout -->
    <div class="portal-layout">
        
        <!-- Left Sidebar Ad -->
        <aside class="portal-sidebar">
            <div id="sidebar_left" class="ad-slot ad-slot--sidebar">
                <!-- Injected by AdsManager -->
            </div>
        </aside>

        <!-- Main Frame Body -->
        <main class="portal-main">
            
            <!-- Game Title Headers -->
            <div class="game-header">
                <h1 id="gameTitleLabel" class="game-header__title">Loading Game...</h1>
                <span id="gameCategoryBadge" class="game-header__category">Category</span>
            </div>

            <!-- Game Player Iframe Box -->
            <div class="game-frame-wrapper">
                <!-- Loading State Spinner (Active until iframe triggers onload event) -->
                <div id="iframe-spinner" class="game-frame-wrapper__loader">
                    <div class="game-frame-wrapper__spinner"></div>
                    <p>Loading Game Canvas...</p>
                </div>
                
                <!-- Iframe mount target -->
                <div id="game-iframe-container">
                    <!-- Dynamic Iframe loaded after Pre-roll skip -->
                </div>
            </div>

            <!-- Related Category Games Section -->
            <section class="related-section">
                <h2 class="section-heading">⭐ Related Games</h2>
                <div id="relatedRow" class="related-row">
                    <!-- Injected dynamically via JS query -->
                </div>
            </section>
            
        </main>

        <!-- Right Sidebar Ad -->
        <aside class="portal-sidebar">
            <div id="sidebar_right" class="ad-slot ad-slot--sidebar">
                <!-- Injected by AdsManager -->
            </div>
        </aside>

    </div>

    <!-- Bottom Leaderboard Ad Slot -->
    <div id="footer_banner" class="ad-slot ad-slot--footer">
        <!-- Injected by AdsManager -->
    </div>

    <!-- Footer Agreement Links -->
    <footer class="portal-footer">
        <div class="portal-footer__copyright">
            © 2026 KidsGameZone — Free Games for Kids
        </div>
        <div class="portal-footer__links">
            <a href="privacy.html" class="portal-footer__link">Privacy Policy</a>
            <span style="color: var(--text-light);">|</span>
            <a href="privacy.html" class="portal-footer__link">COPPA Compliance Notice</a>
        </div>
    </footer>

    <!-- Initialization and Client-Side Routing Controller -->
    <script>
        // Category Badge Color Matching Map
        const categoryColorMap = {
            platformer: 'badge-color--platformer',
            arcade: 'badge-color--arcade',
            puzzle: 'badge-color--puzzle',
            racing: 'badge-color--racing',
            action: 'badge-color--action',
            memory: 'badge-color--memory',
            casual: 'badge-color--casual',
            educational: 'badge-color--educational',
            creative: 'badge-color--creative',
            strategy: 'badge-color--strategy',
            cooking: 'badge-color--cooking',
            'dress-up': 'badge-color--dress-up',
            'virtual-pet': 'badge-color--virtual-pet',
            sandbox: 'badge-color--sandbox',
            rhythm: 'badge-color--rhythm',
            idle: 'badge-color--idle'
        };

        const categoryEmojis = {
            platformer: '🏃', arcade: '🕹️', puzzle: '🧩', racing: '🚗',
            action: '⚔️', memory: '🃏', casual: '🎈', educational: '🎓',
            creative: '🎨', strategy: '🏰', cooking: '🍕', 'dress-up': '👑',
            'virtual-pet': '🐶', sandbox: '🧱', rhythm: '🎵', idle: '⏳'
        };

        document.addEventListener('DOMContentLoaded', function() {
            // 1. Parse URL routing arguments
            const params = new URLSearchParams(window.location.search);
            const slug = params.get('slug');
            const gameId = parseInt(params.get('id'));

            if (!slug || isNaN(gameId)) {
                // If invalid params, fail back to index
                window.location.href = 'index.html';
                return;
            }

            // 2. Fetch full library list
            fetch('/api/games.php')
                .then(res => res.json())
                .then(games => {
                    // Find requested game
                    const game = games.find(g => g.id === gameId || g.slug === slug);
                    if (!game) {
                        window.location.href = 'index.html';
                        return;
                    }

                    // 3. Update view descriptors
                    const updateSeo = (settings) => {
                        const siteName = (settings && settings.site_name) ? settings.site_name : 'KidsGameZone';
                        const resolvedTitle = (game.seo_title && game.seo_title.trim() !== '')
                            ? game.seo_title
                            : `Playing ${game.title} — ${siteName}`;
                        
                        document.title = resolvedTitle;
                        
                        // 1. Meta Description
                        const targetDesc = (game.seo_description && game.seo_description.trim() !== '') 
                            ? game.seo_description 
                            : (settings && settings.seo_description ? settings.seo_description : '');
                        
                        if (targetDesc) {
                            let metaDesc = document.querySelector('meta[name="description"]');
                            if (!metaDesc) {
                                metaDesc = document.createElement('meta');
                                metaDesc.name = 'description';
                                document.head.appendChild(metaDesc);
                            }
                            metaDesc.setAttribute('content', targetDesc);
                        }

                        // 2. Meta Keywords
                        const targetKeywords = (game.seo_keywords && game.seo_keywords.trim() !== '')
                            ? game.seo_keywords
                            : (settings && settings.seo_keywords ? settings.seo_keywords : '');
                        
                        if (targetKeywords) {
                            let metaKeywords = document.querySelector('meta[name="keywords"]');
                            if (!metaKeywords) {
                                metaKeywords = document.createElement('meta');
                                metaKeywords.name = 'keywords';
                                document.head.appendChild(metaKeywords);
                            }
                            metaKeywords.setAttribute('content', targetKeywords);
                        }

                        // 3. Robots Crawling Policy
                        const targetRobots = (game.robots_meta && game.robots_meta !== 'default')
                            ? game.robots_meta
                            : (settings && settings.robots_meta ? settings.robots_meta : 'index, follow');
                        
                        if (targetRobots) {
                            let metaRobots = document.querySelector('meta[name="robots"]');
                            if (!metaRobots) {
                                metaRobots = document.createElement('meta');
                                metaRobots.name = 'robots';
                                document.head.appendChild(metaRobots);
                            }
                            metaRobots.setAttribute('content', targetRobots);
                        }

                        // 4. Social Open Graph & Twitter Cards
                        const baseUrl = window.location.protocol + '//' + window.location.host;
                        const absoluteUrl = baseUrl + window.location.pathname + '?slug=' + game.slug + '&id=' + game.id;
                        
                        // Image resolution
                        let imageUrl = '';
                        if (game.thumbnail && game.thumbnail.trim() !== '') {
                            imageUrl = baseUrl + '/' + game.thumbnail;
                        } else if (settings && settings.logo_path) {
                            if (settings.logo_path.startsWith('data:')) {
                                imageUrl = settings.logo_path;
                            } else {
                                imageUrl = baseUrl + '/' + settings.logo_path;
                            }
                        }
                        
                        const updateMeta = (name, val, isProperty = false) => {
                            const selector = isProperty ? `meta[property="${name}"]` : `meta[name="${name}"]`;
                            let el = document.querySelector(selector);
                            if (!el) {
                                el = document.createElement('meta');
                                if (isProperty) el.setAttribute('property', name);
                                else el.name = name;
                                document.head.appendChild(el);
                            }
                            el.setAttribute('content', val);
                        };

                        updateMeta('og:type', 'website', true);
                        updateMeta('og:url', absoluteUrl, true);
                        updateMeta('og:title', resolvedTitle, true);
                        updateMeta('twitter:card', 'summary_large_image');
                        updateMeta('twitter:url', absoluteUrl);
                        updateMeta('twitter:title', resolvedTitle);
                        
                        if (targetDesc) {
                            updateMeta('og:description', targetDesc, true);
                            updateMeta('twitter:description', targetDesc);
                        }
                        if (imageUrl) {
                            updateMeta('og:image', imageUrl, true);
                            updateMeta('twitter:image', imageUrl);
                        }

                        // 5. Canonical Link
                        let canonicalLink = document.querySelector('link[rel="canonical"]');
                        if (!canonicalLink) {
                            canonicalLink = document.createElement('link');
                            canonicalLink.rel = 'canonical';
                            document.head.appendChild(canonicalLink);
                        }
                        canonicalLink.href = absoluteUrl;
                    };

                    if (window.siteSettings) {
                        updateSeo(window.siteSettings);
                    } else {
                        fetch('api/get-public-settings.php')
                            .then(res => res.json())
                            .then(settings => {
                                window.siteSettings = settings;
                                updateSeo(settings);
                            })
                            .catch(() => updateSeo(null));
                    }
                    document.getElementById('gameTitleLabel').innerText = game.title;
                    
                    const badgeClass = categoryColorMap[game.category] || 'badge-color--arcade';
                    const categoryText = game.category.replace('-', ' ');
                    const categoryLabel = document.getElementById('gameCategoryBadge');
                    categoryLabel.innerText = categoryText;
                    categoryLabel.className = `game-header__category ${badgeClass}`;

                    // Update breadcrumbs
                    document.getElementById('breadcrumbGameTitle').innerText = game.title;
                    const catLink = document.getElementById('breadcrumbCategoryLink');
                    catLink.innerText = categoryText.charAt(0).toUpperCase() + categoryText.slice(1);
                    catLink.href = `index.html?cat=${game.category}`; // Redirects to category filter on homepage

                    // 4. Start game loader (which shows pre-roll countdown and then loads iframe)
                    if (typeof loadGame === 'function') {
                        loadGame(game.slug, game.id, '/' + game.game_path);
                    } else {
                        // Fallback script if deferred loaders take time
                        setTimeout(() => {
                            if (typeof loadGame === 'function') {
                                loadGame(game.slug, game.id, '/' + game.game_path);
                            }
                        }, 500);
                    }

                    // 5. Load and render related games
                    renderRelatedGames(games, game);
                })
                .catch(err => {
                    console.error('Player: Error loading library details.', err);
                });

            // 6. Bind MutationObserver to hide spinner loader once iframe is successfully injected and loaded
            const iframeContainer = document.getElementById('game-iframe-container');
            const observer = new MutationObserver((mutations) => {
                const iframe = iframeContainer.querySelector('iframe');
                if (iframe) {
                    iframe.addEventListener('load', () => {
                        const spinner = document.getElementById('iframe-spinner');
                        if (spinner) {
                            spinner.style.transition = 'opacity 0.3s ease';
                            spinner.style.opacity = '0';
                            setTimeout(() => spinner.style.display = 'none', 300);
                        }
                    });
                    observer.disconnect();
                }
            });
            observer.observe(iframeContainer, { childList: true });
        });

        // Query related same-category games
        function renderRelatedGames(allGames, currentGame) {
            const row = document.getElementById('relatedRow');
            if (!row) return;

            // Filter: same category, exclude active, slice first 4
            const related = allGames
                .filter(g => g.category === currentGame.category && g.id !== currentGame.id)
                .slice(0, 4);

            if (related.length === 0) {
                // If empty category suggestions, fallback to standard featured or generic games
                const fallbacks = allGames.filter(g => g.id !== currentGame.id).slice(0, 4);
                related.push(...fallbacks);
            }

            row.innerHTML = '';
            related.forEach(game => {
                const card = createRelatedCard(game);
                row.appendChild(card);
            });
        }

        // Render card node
        function createRelatedCard(game) {
            const card = document.createElement('div');
            card.className = 'game-card';
            card.addEventListener('click', () => {
                window.location.href = `game.html?slug=${game.slug}&id=${game.id}`;
            });

            card.innerHTML = `
                <div class="game-card__media">
                    <span class="game-card__badge ${categoryColorMap[game.category] || 'badge-color--arcade'}">${game.category.replace('-', ' ')}</span>
                    <img 
                        src="${game.thumbnail}" 
                        alt="${game.title}" 
                        class="game-card__image" 
                        loading="lazy" 
                        onerror="handleImageError(this, '${game.title.replace(/'/g, "\\'")}', '${game.category}')"
                    >
                </div>
                <div class="game-card__info">
                    <h4 class="game-card__title">${game.title}</h4>
                    <button class="game-card__button">▶ Play Now</button>
                </div>
            `;
            return card;
        }

        const categoryHexColors = {
            platformer: '#FF6B35',
            arcade: '#4ECDC4',
            puzzle: '#FFE66D',
            racing: '#EF4444',
            action: '#F43F5E',
            memory: '#3B82F6',
            casual: '#10B981',
            educational: '#8B5CF6',
            creative: '#EC4899',
            strategy: '#6B7280',
            cooking: '#F59E0B',
            'dress-up': '#D946EF',
            'virtual-pet': '#14B8A6',
            sandbox: '#84CC16',
            rhythm: '#6366F1',
            idle: '#06B6D4'
        };

        function generateSvgPlaceholder(title, category) {
            const initial = title ? title.charAt(0).toUpperCase() : '🎮';
            const bg = categoryHexColors[category] || '#FF6B35';
            const fg = category === 'puzzle' ? '#2D3748' : '#FFFFFF';
            
            const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="300" height="200">
                <rect width="100%" height="100%" fill="${bg}"/>
                <text x="50%" y="55%" font-family="'Fredoka', 'Nunito', sans-serif" font-size="80" font-weight="bold" fill="${fg}" text-anchor="middle" dominant-baseline="middle">${initial}</text>
            </svg>`;
            return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
        }

        // Fallback for missing thumbnail
        function handleImageError(imgElement, title, category) {
            imgElement.onerror = null;
            imgElement.src = generateSvgPlaceholder(title, category);
        }
    </script>
</body>
</html>
