<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Balloon Pop - Casual Fun</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="game-container">
        <div class="game-header">
            <a href="../../index.html" class="back-link">🏠 Exit</a>
            <div class="game-title">Balloon Pop</div>
            <div class="score-board">
                Score: <span id="scoreVal">0</span>
            </div>
        </div>

        <div class="canvas-wrapper">
            <canvas id="gameCanvas" width="400" height="600"></canvas>
            <div class="lives-display">Missed: <span id="missedVal">0</span> / 5</div>
        </div>

        <div class="game-footer">
            <div class="high-score-line">Best Record: <span id="highScoreVal">0</span></div>
            <span class="controls-hint">Tap or click the rising balloons before they reach the top!</span>
            <button id="restartBtn" class="restart-btn">🔄 Restart</button>
        </div>

        <!-- Start Overlay -->
        <div class="overlay active" id="startOverlay">
            <div class="overlay-content">
                <h2>Balloon Pop!</h2>
                <p>Pop the balloons before they float away!</p>
                <div class="balloon-points-legend">
                    <p><span class="color-dot red"></span> Red: 10 pts</p>
                    <p><span class="color-dot blue"></span> Blue: 20 pts</p>
                    <p><span class="color-dot gold"></span> Gold: 50 pts</p>
                </div>
                <button id="startBtn" class="restart-btn">START PLAYING</button>
            </div>
        </div>

        <!-- Game Over Overlay -->
        <div class="overlay" id="gameOverOverlay">
            <div class="overlay-content">
                <h2>Game Over!</h2>
                <p>Final Score: <span id="finalScoreVal">0</span></p>
                <p>High Score: <span id="overlayHighScoreVal">0</span></p>
                <button id="overlayRestartBtn" class="restart-btn">Play Again</button>
            </div>
        </div>
    </div>

    <!-- Script Logic -->
    <script src="game.js"></script>
</body>
</html>
