<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🌸 Super Girl — KidsGameZone</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="game-container">
        <!-- Back Link and Header info -->
        <div class="game-header">
            <a href="../../index.html" class="back-link">🏠 Back to Games</a>
            <div class="game-title">🌸 Super Girl</div>

            <div class="score-board">
                Score: <span id="scoreVal">0</span> | High: <span id="highScoreVal">0</span>
            </div>
        </div>

        <!-- HTML5 Canvas Render Target -->
        <div class="canvas-wrapper">
            <canvas id="gameCanvas" width="800" height="500"></canvas>
        </div>

        <div class="game-footer">
            <span class="controls-hint">Controls: A/D or Left/Right to Move | W/Space or Up to Jump (Double Jump allowed)</span>
        </div>
    </div>

    <!-- Core Game Logic -->
    <script src="game.js"></script>
</body>
</html>
