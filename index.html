<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Dynamic Settings & Maintenance Guard -->
    <script>
        (function() {
            fetch('api/get-public-settings.php')
                .then(res => res.json())
                .then(settings => {
                    if (settings.maintenance_mode === '1') {
                        window.location.href = 'maintenance.html';
                        return;
                    }
                    
                    if (settings.site_name) {
                        document.title = document.title.replace('KidsGameZone', settings.site_name);
                        document.querySelectorAll('.portal-header__logo').forEach(el => {
                            el.innerText = '🎮 ' + settings.site_name;
                        });
                        const copyrightEl = document.querySelector('.portal-footer__copyright');
                        if (copyrightEl) {
                            copyrightEl.innerText = copyrightEl.innerText.replace('KidsGameZone', settings.site_name);
                        }
                    }
                    
                    if (settings.site_tagline) {
                        const taglineEl = document.querySelector('.portal-header__tagline');
                        if (taglineEl) {
                            taglineEl.innerText = settings.site_tagline;
                        }
                    }
                    
                    if (settings.seo_description) {
                        const metaDesc = document.querySelector('meta[name="description"]');
                        if (metaDesc) {
                            metaDesc.setAttribute('content', settings.seo_description);
                        }
                        const ogDesc = document.querySelector('meta[property="og:description"]');
                        if (ogDesc) ogDesc.setAttribute('content', settings.seo_description);
                        const twitterDesc = document.querySelector('meta[name="twitter:description"]');
                        if (twitterDesc) twitterDesc.setAttribute('content', settings.seo_description);
                    }

                    if (settings.site_name && settings.site_tagline) {
                        const brandTitle = `${settings.site_name} — ${settings.site_tagline}`;
                        const ogTitle = document.querySelector('meta[property="og:title"]');
                        if (ogTitle) ogTitle.setAttribute('content', brandTitle);
                        const twitterTitle = document.querySelector('meta[name="twitter:title"]');
                        if (twitterTitle) twitterTitle.setAttribute('content', brandTitle);
                    }

                    if (settings.seo_keywords) {
                        let metaKeywords = document.querySelector('meta[name="keywords"]');
                        if (!metaKeywords) {
                            metaKeywords = document.createElement('meta');
                            metaKeywords.name = 'keywords';
                            document.head.appendChild(metaKeywords);
                        }
                        metaKeywords.setAttribute('content', settings.seo_keywords);
                    }

                    if (settings.robots_meta) {
                        let metaRobots = document.querySelector('meta[name="robots"]');
                        if (!metaRobots) {
                            metaRobots = document.createElement('meta');
                            metaRobots.name = 'robots';
                            document.head.appendChild(metaRobots);
                        }
                        metaRobots.setAttribute('content', settings.robots_meta);
                    }

                    if (settings.logo_path) {
                        const absoluteLogoUrl = window.location.protocol + '//' + window.location.host + '/' + settings.logo_path;
                        const ogImage = document.querySelector('meta[property="og:image"]');
                        if (ogImage) ogImage.setAttribute('content', absoluteLogoUrl);
                        const twitterImage = document.querySelector('meta[name="twitter:image"]');
                        if (twitterImage) twitterImage.setAttribute('content', absoluteLogoUrl);
                    }
                    
                    if (settings.google_analytics_id && settings.google_analytics_id.trim() !== '') {
                        const gaId = settings.google_analytics_id;
                        const gaScript1 = document.createElement('script');
                        gaScript1.async = true;
                        gaScript1.src = 'https://www.googletagmanager.com/gtag/js?id=' + gaId;
                        document.head.appendChild(gaScript1);
                        
                        const gaScript2 = document.createElement('script');
                        gaScript2.innerHTML = `
                            window.dataLayer = window.dataLayer || [];
                            function gtag(){dataLayer.push(arguments);}
                            gtag('js', new Date());
                            gtag('config', '${gaId}');
                        `;
                        document.head.appendChild(gaScript2);
                    }
                })
                .catch(err => console.error('Error loading public configuration:', err));
        })();
    </script>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="assets/images/ui/favicon.png">
    <link rel="apple-touch-icon" href="assets/images/ui/apple-touch-icon.png">

    <!-- PWA Manifest & Theme Color -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#FF6B35">

    <!-- SEO Meta Tags -->
    <title>KidsGameZone — Play 50 Free Kids Games Online</title>
    <meta name="title" content="KidsGameZone — Play 50 Free Kids Games Online">
    <meta name="description" content="Free browser games for kids aged 5-14. Play puzzle, racing, arcade and educational games instantly — no download needed!">
    <meta name="keywords" content="kids games, free online games, browser games, educational games, arcade games for kids">
    <meta name="author" content="KidsGameZone">
    <meta name="robots" content="index, follow">
    
    <!-- Open Graph / Facebook -->

    <meta property="og:url" content="https://yourdomain.com/">
    <meta property="og:title" content="KidsGameZone — Play 50 Free Kids Games Online">
    <meta property="og:description" content="Free browser games for kids aged 5-14!">
    <meta property="og:image" content="https://yourdomain.com/assets/images/ui/og-image.jpg">

    <meta name="twitter:description" content="Play free browser games instantly — no download!">
    <meta name="twitter:image" content="https://yourdomain.com/assets/images/ui/og-image.jpg">
    
    <!-- Canonical -->

    <!-- Bubbly & Friendly Google Fonts -->

    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
    
    <!-- Critical CSS Inline -->
    <style>
        :root {
          --primary: #FF6B35;
          --secondary: #4ECDC4;
          --accent: #FFE66D;
          --purple: #A855F7;
          --bg: #FFF9F0;
          --card-bg: #FFFFFF;
          --text: #2D3748;
          --text-light: #718096;
          --border-radius: 16px;
          --border-style: 4px solid #2D3748;
          --shadow: 0 8px 0px #2D3748;
          --shadow-hover: 0 14px 0px #2D3748;
          --transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        body {
          font-family: 'Nunito', sans-serif;
          background-color: var(--bg);
          color: var(--text);
          margin: 0;
          padding: 0;
          min-height: 100vh;
          display: flex;
          flex-direction: column;
        }
        .portal-header {
          background-color: var(--card-bg);
          border-bottom: var(--border-style);
          padding: 20px 40px;
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 20px;
        }
        @media (min-width: 768px) {
          .portal-header {
            flex-direction: row;
            justify-content: space-between;
          }
        }
        .portal-header__logo {
          font-family: 'Fredoka', cursive;
          font-size: 2.2rem;
          color: var(--primary);
          text-shadow: 2px 2px 0px var(--text);
          -webkit-text-stroke: 1.5px var(--text);
          text-decoration: none;
        }
        .portal-header__tagline {
          font-size: 1rem;
          font-weight: 700;
          color: var(--text-light);
          margin-top: 5px;
        }
        .portal-layout {
          display: flex;
          flex-direction: column;
          padding: 30px 20px;
          gap: 30px;
          max-width: 1400px;
          margin: 0 auto;
          width: 100%;
        }
        @media (min-width: 1024px) {
          .portal-layout {
            flex-direction: row;
            padding: 30px 40px;
          }
        }
        .portal-main {
          flex-grow: 1;
          display: flex;
          flex-direction: column;
          gap: 40px;
        }
    </style>

    <!-- Stylesheets -->
    <link rel="stylesheet" href="assets/css/main.css">
    
    <!-- Ad and Core Scripts (Loaded at top/async to run properly on DOM content load) -->
    <script src="assets/js/ads.js" defer></script>
    <script src="assets/js/main.js" defer></script>
</head>
<body>

    <!-- Portal Top Bar / Header -->
    <header class="portal-header">
        <div class="portal-header__brand">
            <a href="index.html" class="portal-header__logo">🎮 KidsGameZone</a>
            <div class="portal-header__tagline">Play 50 Free Kids Games Online!</div>
        </div>
        
        <!-- Interactive Live Search -->
        <div class="search-container">
            <input type="text" id="gameSearch" class="search-input" placeholder="🔍 Search games..." aria-label="Search games">
        </div>
    </header>

    <!-- Top Leaderboard Ad Spot -->
    <div id="header_banner" class="ad-slot ad-slot--header">
        <!-- Injected by AdsManager -->
    </div>

    <!-- Main Workspace Layout -->
    <div class="portal-layout">
        
        <!-- Left Sidebar Ad (Desktop Only) -->
        <aside class="portal-sidebar">
            <div id="sidebar_left" class="ad-slot ad-slot--sidebar">
                <!-- Injected by AdsManager -->
            </div>
        </aside>

        <!-- Main Portal Body -->
        <main class="portal-main">
            
            <!-- Category Filtering Tabs -->
            <section class="category-section">
                <div id="categoryTabs" class="category-filters">
                    <!-- Loaded dynamically via AJAX -->
                </div>
            </section>

            <!-- Featured Games Row -->
            <section id="featuredSection" class="featured-section">
                <h2 class="section-heading">⭐ Featured Games</h2>
                <div id="featuredRow" class="featured-row">
                    <!-- Loaded dynamically via AJAX -->
                </div>
            </section>

            <!-- All Games Grid Section -->
            <section class="games-grid-container">
                <h2 class="section-heading">🎮 All Games</h2>
                <div id="gamesGrid" class="games-grid">
                    <!-- Loaded dynamically via AJAX -->
                </div>
            </section>
            
        </main>

        <!-- Right Sidebar Ad (Desktop Only) -->
        <aside class="portal-sidebar">
            <div id="sidebar_right" class="ad-slot ad-slot--sidebar">
                <!-- Injected by AdsManager -->
            </div>
        </aside>

    </div>

    <!-- Bottom Leaderboard Ad Spot -->
    <div id="footer_banner" class="ad-slot ad-slot--footer">
        <!-- Injected by AdsManager -->
    </div>

    <!-- Portal Footer -->
    <footer class="portal-footer">
        <div class="portal-footer__copyright">
            © 2026 KidsGameZone — Free Games for Kids
        </div>
        <div class="portal-footer__links">
            <a href="privacy.html" class="portal-footer__link">Privacy Policy</a>
            <span style="color: var(--text-light);">|</span>
            <a href="privacy.html" class="portal-footer__link">COPPA Compliance Notice</a>
        </div>
    </footer>

    <!-- Service Worker Registration -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('Service Worker registered!', reg))
                    .catch(err => console.error('Service Worker registration failed:', err));
            });
        }
    </script>

    <!-- Structured Data - JSON-LD -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "KidsGameZone",
      "url": "https://yourdomain.com",
      "description": "Free browser games for kids aged 5-14",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://yourdomain.com/?search={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
</body>
</html>
