<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sweet Match-3 - Candy Puzzle</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="game-container">
        <div class="game-header">
            <a href="../../index.html" class="back-link">🏠 Exit</a>
            <div class="game-title">Sweet Match-3</div>
            <div class="score-board">
                Score: <span id="scoreVal">0</span>
            </div>
        </div>

        <div class="grid-wrapper">
            <div class="candy-grid" id="candyGrid">
                <!-- Populated dynamically via javascript -->
            </div>
        </div>

        <div class="game-footer">
            <div class="combo-line">Combo Chain: <span id="comboVal">x1</span></div>
            <div class="high-score-line">Best Record: <span id="highScoreVal">0</span></div>
            <span class="controls-hint">Tap a candy, then tap an adjacent candy to swap them. Match 3 or more in a row!</span>
            <button id="restartBtn" class="restart-btn">🔄 Restart</button>
        </div>
    </div>

    <!-- Script Logic -->
    <script src="game.js"></script>
</body>
</html>
